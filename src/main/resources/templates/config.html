<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推送配置 - 抓拍模拟系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.3.3"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f5f7fa; color: #333; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        .sidebar { background-color: #1c1c50; color: white; transition: all 0.3s; }
        .content-area { background-color: #111242; color: white; }
        .nav-item { transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background-color: rgba(255,255,255,0.1); }
        .nav-item.active { background-color: rgba(255,255,255,0.15); border-left: 3px solid #4f46e5; }
        .btn-primary { background-color: #4f46e5; transition: all 0.2s; }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-danger { background-color: #dc2626; transition: all 0.2s; }
        .btn-danger:hover { background-color: #b91c1c; }
        .modal-overlay { background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: #1c1c50; }
        .table-row:hover { background-color: rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex">
    <div class="sidebar w-64 h-full flex-shrink-0 flex flex-col">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-xl font-bold flex items-center">
                <i class="fas fa-camera mr-2"></i>
                抓拍模拟系统
            </h1>
        </div>
        <nav class="flex-1 overflow-y-auto">
            <ul class="space-y-1 p-2">
                <li>
                    <a href="device" class="nav-item flex items-center p-3 rounded">
                        <i class="fas fa-server mr-3"></i>
                        <span>设备管理</span>
                    </a>
                </li>
                <li>
                    <a href="task" class="nav-item flex items-center p-3 rounded">
                        <i class="fas fa-tasks mr-3"></i>
                        <span>推送任务</span>
                    </a>
                </li>
                <li>
                    <a href="library" class="nav-item flex items-center p-3 rounded">
                        <i class="fas fa-database mr-3"></i>
                        <span>模拟库管理</span>
                    </a>
                </li>
                <li>
                    <a href="config" class="nav-item active flex items-center p-3 rounded">
                        <i class="fas fa-cog mr-3"></i>
                        <span>推送配置</span>
                    </a>
                </li>
                <li>
                    <a href="task-log" class="nav-item flex items-center p-3 rounded">
                        <i class="fas fa-clipboard-list mr-3"></i>
                        <span>任务日志</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="p-4 border-t border-gray-700 text-sm text-gray-400">
            <p>系统版本: v1.0.0</p>
            <p class="mt-1">© 2025 北京清思智能科技有限公司</p>
        </div>
    </div>
    <div class="content-area flex-1 h-full overflow-y-auto">
        <div id="config" class="tab-content p-6 block">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">
                    <i class="fas fa-cog mr-2"></i>
                    推送配置
                    <span class="ml-2 relative group">
                        <i class="fas fa-question-circle text-blue-400 cursor-pointer"></i>
                        <span class="absolute left-1/2 -translate-x-1/2 mt-2 w-64 bg-gray-900 text-white text-xs rounded shadow-lg px-3 py-2 z-10 hidden group-hover:block" style="white-space:normal;">
                            固定两项配置不可删除: 1. kafka推送主题  2. 解析一体机
                        </span>
                    </span>
                </h2>
                <button class="btn-primary px-4 py-2 rounded flex items-center" onclick="showAddConfigModal()">
                    <i class="fas fa-plus mr-2"></i>
                    新增配置
                </button>
            </div>
            <div class="bg-gray-800 rounded-lg overflow-hidden">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-700 text-left">
                            <th class="p-3">配置项</th>
                            <th class="p-3">配置值</th>
                            <th class="p-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="config-tbody">
                        <!-- JS渲染配置数据 -->
                    </tbody>
                </table>
            </div>
            <div class="flex justify-center mt-6">
                <div class="flex space-x-1" id="config-pagination">
                    <!-- JS渲染分页按钮 -->
                </div>
            </div>
        </div>
        <!-- 新增/编辑配置模态框 -->
        <div id="config-modal" class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
            <div class="modal-content rounded-lg w-11/12 max-w-2xl">
                <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                    <h3 class="text-lg font-bold" id="config-modal-title">新增配置</h3>
                    <button class="text-gray-400 hover:text-white" onclick="hideConfigModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="p-4">
                    <input type="hidden" id="config-id">
                    <div class="mb-4">
                        <label class="block text-gray-400 mb-2">配置项</label>
                        <input id="config-name" type="text" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-400 mb-2">配置值</label>
                        <input id="config-content" type="text" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-400 mb-2">配置类型</label>
                        <select id="config-type" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2">
                            <option value="custom">自定义</option>
                            <option value="undeletable">不可删除</option>
                        </select>
                    </div>
                </div>
                <div class="p-4 border-t border-gray-700 flex justify-end">
                    <button class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 mr-2" onclick="hideConfigModal()">取消</button>
                    <button class="btn-primary px-4 py-2 rounded" onclick="submitConfig()" id="config-modal-submit">保存</button>
                </div>
            </div>
        </div>
        <!-- Bootstrap Toast -->
        <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>
        <!-- Bootstrap 确认删除模态框 -->
        <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="confirmDeleteModalLabel">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                确定要删除此配置吗？
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">删除</button>
              </div>
            </div>
          </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    let configCurrentPage = 1;
    const configPageSize = 10;
    let deleteConfigId = null;

    function loadConfigs(page = 1) {
        fetch(`/config/page?page=${page}&size=${configPageSize}`)
            .then(res => res.json())
            .then(data => {
                const result = data.records ? data : (data.data ? data.data : {});
                renderConfigTable(result.records || []);
                renderConfigPagination(result.current || 1, result.pages || 1);
                configCurrentPage = result.current || 1;
            });
    }

    function renderConfigTable(configs) {
        const tbody = document.getElementById('config-tbody');
        tbody.innerHTML = '';
        configs.forEach(config => {
            const undeletable = config.type === 'undeletable';
            tbody.innerHTML += `
                <tr class="table-row border-t border-gray-700">
                    <td class="p-3">${config.name}</td>
                    <td class="p-3">${config.content}</td>
                    <td class="p-3 text-right">
                        <button class="btn-primary px-3 py-1 rounded text-sm" onclick="showEditConfigModal(${config.id}, '${config.name}', '${config.content}', '${config.type}')">编辑</button>
                        <button class="btn-danger px-3 py-1 rounded text-sm" onclick="${undeletable ? '' : `deleteConfig(${config.id})`}" ${undeletable ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>删除</button>
                    </td>
                </tr>
            `;
        });
    }

    function renderConfigPagination(current, total) {
        const container = document.getElementById('config-pagination');
        container.innerHTML = '';
        if (total < 1) total = 1;
        for (let i = 1; i <= total; i++) {
            container.innerHTML += `<button class="pagination-btn w-8 h-8 rounded flex items-center justify-center ${i === current ? 'active' : ''}" onclick="loadConfigs(${i})">${i}</button>`;
        }
    }

    function showAddConfigModal() {
        document.getElementById('config-modal-title').innerText = '新增配置';
        document.getElementById('config-id').value = '';
        document.getElementById('config-name').value = '';
        document.getElementById('config-content').value = '';
        document.getElementById('config-modal').classList.remove('hidden');
        document.getElementById('config-type') && (document.getElementById('config-type').value = 'custom');
    }

    function showEditConfigModal(id, name, content, type = 'custom') {
        document.getElementById('config-modal-title').innerText = '编辑配置';
        document.getElementById('config-id').value = id;
        document.getElementById('config-name').value = name;
        document.getElementById('config-content').value = content;
        document.getElementById('config-modal').classList.remove('hidden');
        document.getElementById('config-type') && (document.getElementById('config-type').value = type);
    }

    function hideConfigModal() {
        document.getElementById('config-modal').classList.add('hidden');
    }

    function showToast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const id = 'toast-' + Date.now();
        const color = type === 'success' ? 'bg-success' : type === 'danger' ? 'bg-danger' : 'bg-primary';
        const html = `<div id="${id}" class="toast align-items-center text-white ${color} border-0 show" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">${msg}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>`;
        container.insertAdjacentHTML('beforeend', html);
        setTimeout(() => {
            const el = document.getElementById(id);
            if (el) el.remove();
        }, 2000);
    }

    function deleteConfig(id) {
        deleteConfigId = id;
        const modal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
        modal.show();
    }

    document.getElementById('confirmDeleteBtn').onclick = function() {
        if (!deleteConfigId) return;
        fetch(`/config/delete?id=${deleteConfigId}`, {method: 'POST'})
            .then(res => res.json())
            .then(success => {
                if (success) loadConfigs(configCurrentPage);
                else showToast('删除失败', 'danger');
            });
        deleteConfigId = null;
        bootstrap.Modal.getInstance(document.getElementById('confirmDeleteModal')).hide();
    };

    function submitConfig() {
        const id = document.getElementById('config-id').value;
        const name = document.getElementById('config-name').value;
        const content = document.getElementById('config-content').value;
        const type = document.getElementById('config-type') ? document.getElementById('config-type').value : 'custom';
        const url = id ? '/config/edit' : '/config/add';
        fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id ? Number(id) : undefined, name, content, type})
        }).then(res => res.json()).then(success => {
            if (success) {
                hideConfigModal();
                loadConfigs(configCurrentPage);
                showToast('操作成功', 'success');
            } else {
                showToast('操作失败', 'danger');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadConfigs();
    });
    </script>
</body>
</html>
