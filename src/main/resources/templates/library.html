<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟库管理 - 抓拍模拟系统</title>
    <script src="https://cdn.tailwindcss.com/3.3.3"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f5f7fa; color: #333; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        .sidebar { background-color: #1c1c50; color: white; transition: all 0.3s; }
        .content-area { background-color: #111242; color: white; }
        .nav-item { transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background-color: rgba(255,255,255,0.1); }
        .nav-item.active { background-color: rgba(255,255,255,0.15); border-left: 3px solid #4f46e5; }
        .card { background-color: rgba(255,255,255,0.05); transition: all 0.3s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #4f46e5; transition: all 0.2s; }
        .btn-primary:hover { background-color: #4338ca; }
        .modal-overlay { background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: #1c1c50; }
    </style>
</head>
<body class="flex">
    <div class="sidebar w-64 h-full flex-shrink-0 flex flex-col">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-xl font-bold flex items-center">
                <i class="fas fa-camera mr-2"></i>
                抓拍模拟系统
            </h1>
        </div>
        <nav class="flex-1 overflow-y-auto">
            <ul class="space-y-1 p-2">
                <li>
                    <a href="device" class="nav-item flex items-center p-3 rounded">
                        <i class="fas fa-server mr-3"></i>
                        <span>设备管理</span>
                    </a>
                </li>
                <li>
                    <a href="task" class="nav-item flex items-center p-3 rounded">
                        <i class="fas fa-tasks mr-3"></i>
                        <span>推送任务</span>
                    </a>
                </li>
                <li>
                    <a href="library" class="nav-item active flex items-center p-3 rounded">
                        <i class="fas fa-database mr-3"></i>
                        <span>模拟库管理</span>
                    </a>
                </li>
                <li>
                    <a href="config" class="nav-item flex items-center p-3 rounded">
                        <i class="fas fa-cog mr-3"></i>
                        <span>推送配置</span>
                    </a>
                </li>
                <li>
                    <a href="task-log" class="nav-item flex items-center p-3 rounded">
                        <i class="fas fa-clipboard-list mr-3"></i>
                        <span>任务日志</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="p-4 border-t border-gray-700 text-sm text-gray-400">
            <p>系统版本: v1.0.0</p>
            <p class="mt-1">© 2025 北京清思智能科技有限公司</p>
        </div>
    </div>
    <div class="content-area flex-1 h-full overflow-y-auto">
        <div id="library" class="tab-content p-6 block">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">
                    <i class="fas fa-database mr-2"></i>
                    模拟库管理
                    <span class="ml-2 relative group">
                        <i class="fas fa-question-circle text-blue-400 cursor-pointer"></i>
                        <span class="absolute left-1/2 -translate-x-1/2 mt-2 w-64 bg-gray-900 text-white text-xs rounded shadow-lg px-3 py-2 z-10 hidden group-hover:block" style="white-space:normal;">
                            模拟库存储单位是一组图,包括人脸图和场景图,抽特征会提供小图坐标但不会存储人脸图,由于是循环推流,为了避免多次存图,这里直接使用提供的原始大小图.
                        </span>
                    </span>
                </h2>
                <button class="btn-primary px-4 py-2 rounded flex items-center" onclick="showCreateLibraryModal()">
                    <i class="fas fa-plus mr-2"></i>
                    新建库
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="library-list">
            </div>
        </div>
        <!-- 新建库模态框 -->
        <div id="create-library-modal" class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
            <div class="modal-content rounded-lg w-11/12 max-w-2xl">
                <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                    <h3 class="text-lg font-bold flex items-center">新建库
                        <span class="ml-2 relative group">
                            <i class="fas fa-question-circle text-blue-400 cursor-pointer"></i>
                            <span class="absolute left-1/2 -translate-x-1/2 mt-2 w-64 bg-gray-900 text-white text-xs rounded shadow-lg px-3 py-2 z-10 hidden group-hover:block" style="white-space:normal;">
                                库名称为必填项，建议简明描述库用途。创建后可在库详情中添加人员。
                            </span>
                        </span>
                    </h3>
                    <button class="text-gray-400 hover:text-white" onclick="hideModal('create-library-modal')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="p-4">
                    <div class="mb-4">
                        <label class="block text-gray-400 mb-2">库名称</label>
                        <input id="library-name" type="text" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-400 mb-2">库说明</label>
                        <textarea id="library-desc" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500" rows="2" placeholder="可选，简要描述库用途"></textarea>
                    </div>
                </div>
                <div class="p-4 border-t border-gray-700 flex justify-end">
                    <button class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 mr-2" onclick="hideModal('create-library-modal')">
                        取消
                    </button>
                    <button class="btn-primary px-4 py-2 rounded" onclick="createLibrary()">
                        创建
                    </button>
                </div>
            </div>
        </div>
        <!-- Bootstrap风格弹窗 -->
        <div id="toast-container" class="fixed top-6 right-6 z-50"></div>
    </div>
    <script>
        function showCreateLibraryModal() {
            document.getElementById('create-library-modal').classList.remove('hidden');
            document.getElementById('library-name').value = '';
            document.getElementById('library-desc').value = '';
            document.getElementById('library-name').removeAttribute('data-edit-id');
        }
        function hideModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
        function showLibraryDetail(libraryId) {
            window.location.href = 'library-detail?id=' + libraryId;
        }
        function createLibrary() {
            const name = document.getElementById('library-name').value.trim();
            const description = document.getElementById('library-desc').value.trim();
            if (!name) {
                showToast('库名称不能为空', 'danger');
                return;
            }
            const editId = document.getElementById('library-name').getAttribute('data-edit-id');
            const url = editId ? '/library/edit' : '/library/add';
            const body = editId ? {id: Number(editId), name, description} : {name, description};
            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            }).then(res => res.json()).then(success => {
                if (success) {
                    hideModal('create-library-modal');
                    showToast(editId ? '编辑成功' : '新建库成功', 'success');
                    document.getElementById('library-name').removeAttribute('data-edit-id');
                    loadLibraryList();
                } else {
                    showToast(editId ? '编辑失败' : '新建库失败', 'danger');
                }
            });
        }
        function loadLibraryList() {
            fetch('/library/list').then(res => res.json()).then(list => {
                renderLibraryList(list);
            });
        }
        function showEditLibraryModal(id, name, description) {
            document.getElementById('create-library-modal').classList.remove('hidden');
            document.getElementById('library-name').value = name;
            document.getElementById('library-desc').value = description;
            document.getElementById('library-name').setAttribute('data-edit-id', id);
        }
        function deleteLibrary(id) {
            fetch(`/libraryDetail/list?libraryId=${id}`)
                .then(res => res.json())
                .then(persons => {
                    if (persons && persons.length > 0) {
                        showToast('该库下有人员，无法删除', 'danger');
                    } else {
                        showConfirm('确定要删除该库吗？', () => {
                            fetch(`/library/delete?id=${id}`, {method: 'POST'})
                                .then(res => res.json())
                                .then(success => {
                                    if (success) {
                                        showToast('删除成功', 'success');
                                        loadLibraryList();
                                    } else {
                                        showToast('删除失败', 'danger');
                                    }
                                });
                        });
                    }
                });
        }
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const id = 'toast-' + Date.now();
            const color = type === 'success' ? 'bg-green-500' : type === 'danger' ? 'bg-red-500' : 'bg-blue-500';
            const html = `<div id="${id}" class="${color} text-white px-4 py-2 rounded shadow mb-2 animate-fade-in">${msg}</div>`;
            container.insertAdjacentHTML('beforeend', html);
            setTimeout(() => {
                const el = document.getElementById(id);
                if (el) el.remove();
            }, 2000);
        }
        function showConfirm(msg, onConfirm) {
            let modal = document.getElementById('confirm-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'confirm-modal';
                modal.className = 'fixed inset-0 flex items-center justify-center z-50';
                modal.innerHTML = `
                    <div class="absolute inset-0 bg-black opacity-50"></div>
                    <div class="bg-white rounded-lg shadow-lg p-6 max-w-sm w-full relative z-10">
                        <div class="mb-4 text-gray-800 text-lg font-bold">${msg}</div>
                        <div class="flex justify-end space-x-2">
                            <button class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400" onclick="hideConfirm()">取消</button>
                            <button class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700" id="confirm-ok-btn">确定</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            } else {
                modal.querySelector('.mb-4').innerText = msg;
            }
            modal.style.display = 'flex';
            document.getElementById('confirm-ok-btn').onclick = function() {
                hideConfirm();
                onConfirm && onConfirm();
            };
        }
        function hideConfirm() {
            const modal = document.getElementById('confirm-modal');
            if (modal) modal.style.display = 'none';
        }
        function renderLibraryList(libraryList) {
            const container = document.getElementById('library-list');
            container.innerHTML = '';
            libraryList.forEach(library => {
                container.innerHTML += `
                    <div class="card rounded-lg p-4">
                        <div class="flex justify-between items-start">
                            <div class="cursor-pointer" onclick="showLibraryDetail(${library.id})">
                                <h3 class="font-bold text-lg">${library.name}</h3>
                                <p class="text-gray-400 mt-1">${library.description || ''}</p>
                            </div>
                            <div class="flex flex-col items-end space-y-2">
                                <button class="btn-primary px-3 py-1 rounded text-sm mb-1" onclick="event.stopPropagation(); showEditLibraryModal(${library.id}, '${library.name}', '${library.description || ''}')">编辑</button>
                                <button class="btn-danger px-3 py-1 rounded text-sm" onclick="event.stopPropagation(); deleteLibrary(${library.id})">删除</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        document.addEventListener('DOMContentLoaded', function() {
            loadLibraryList();
        });
    </script>
</body>
</html>
